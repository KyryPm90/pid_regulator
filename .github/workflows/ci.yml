name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pid
          POSTGRES_PASSWORD: pid
          POSTGRES_DB: pid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pid"
          --health-interval 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://pid:pid@localhost:5432/pid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: apps/web/dist

  deploy:
    # Деплой на GitHub Pages вмикається змінною репозиторію PAGES_ENABLED=true
    # (Pages для приватних репозиторіїв доступний лише на платних планах).
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
